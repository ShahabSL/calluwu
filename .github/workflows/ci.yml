name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Scan source, lockfiles, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          version: v0.72.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
      - name: Prepare SBOM artifact directory
        run: mkdir -p artifacts
      - name: Generate CycloneDX source SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          version: v0.72.0
          format: cyclonedx
          output: artifacts/calluwu-source.cdx.json
      - name: Upload source SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: calluwu-public-source-sbom-${{ github.sha }}
          path: artifacts/calluwu-source.cdx.json
          if-no-files-found: error
          retention-days: 30

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm licenses:node
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:ts
      - run: pnpm -r build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo install cargo-deny --locked --version 0.19.4
      - run: cargo audit --deny warnings
      - run: cargo deny check licenses
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: docker build --platform linux/amd64 -f runtime/calluwu-core/Dockerfile -t calluwu-runtime:ci .
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: calluwu-runtime:ci
          version: v0.72.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
      - name: Prepare runtime SBOM artifact directory
        run: mkdir -p artifacts
      - name: Generate CycloneDX runtime image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: calluwu-runtime:ci
          scanners: vuln
          version: v0.72.0
          format: cyclonedx
          output: artifacts/calluwu-runtime.cdx.json
      - name: Upload runtime image SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: calluwu-public-runtime-sbom-${{ github.sha }}
          path: artifacts/calluwu-runtime.cdx.json
          if-no-files-found: error
          retention-days: 30
